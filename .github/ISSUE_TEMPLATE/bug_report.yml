name: Bug report
description: Something isn't working as documented.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph. What happened, what did you expect?
    validations:
      required: true
  - type: input
    id: mcp-version
    attributes:
      label: civicrm-mcp version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: civicrm-version
    attributes:
      label: CiviCRM version
      placeholder: "5.79.x"
    validations:
      required: true
  - type: dropdown
    id: cms
    attributes:
      label: CMS host
      options:
        - drupal
        - wordpress
        - standalone
        - backdrop
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "20.11.1"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimum steps, env (with secrets redacted), and the tool call that triggered it.
      placeholder: |
        1. .env contents (with keys redacted) ...
        2. Called civicrm_find_contacts with { "query": "smith" }
        3. Got ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have run `civicrm_system_info` and confirmed auth works.
        - label: I have confirmed the issue is not operator-side (permissions, site key, CMS routing).
