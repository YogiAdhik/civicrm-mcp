name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # required for MCP Registry OIDC and npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/run-tests.mjs

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify server.json version matches
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          PKG_IN_SERVER=$(node -p "require('./server.json').packages[0].version")
          if [ "$PKG_VERSION" != "$SERVER_VERSION" ] || [ "$PKG_VERSION" != "$PKG_IN_SERVER" ]; then
            echo "::error::server.json versions ($SERVER_VERSION / $PKG_IN_SERVER) must match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Check if version already on npm (idempotent release)
        id: npm-check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "civicrm-mcp@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::civicrm-mcp@$PKG_VERSION is already on npm — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.published == 'false'
        # --provenance is disabled: rekor.sigstore.dev has been flaky (ETIMEDOUT).
        # Re-enable once upstream is reliable.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --help

      - name: Publish to MCP Registry (GitHub OIDC)
        run: |
          set -e
          mcp-publisher login github-oidc
          # Don't fail the whole release if a duplicate version is already indexed.
          if mcp-publisher publish 2>&1 | tee /tmp/mcp-pub.log; then
            echo "::notice::Registry publish succeeded."
          elif grep -qiE "already exists|duplicate" /tmp/mcp-pub.log; then
            echo "::notice::Version already on MCP Registry — skipping."
          else
            cat /tmp/mcp-pub.log
            exit 1
          fi
